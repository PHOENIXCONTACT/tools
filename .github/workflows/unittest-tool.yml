name: UnitTests

on:
  workflow_call:
    inputs:
      dotnet_sdk_version:
        required: true
        type: string
      REPOSITORY_NAME:
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: '20'
      runsettings:
        required: false
        type: string
        default: ''
        description: 'Optional path to a .runsettings file for dotnet test'

jobs:
  UnitTests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_sdk_version }}

      - name: Setup Node version
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Clean
        run: dotnet clean && dotnet nuget locals all --clear

      - name: Execute dotnet restore
        run: dotnet restore

      - name: Execute dotnet build
        run: dotnet build --no-restore

      - name: Execute dotnet test (needs coverlet.collector nuget)
        run: >-
          dotnet test --no-build
          --filter FullyQualifiedName!~Integration
          ${{ inputs.runsettings != '' && format('--settings {0}', inputs.runsettings) || '--collect:"XPlat Code Coverage"' }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: ${{inputs.REPOSITORY_NAME}}-test-results
          path: src/Tests/**/TestResults/**/coverage.cobertura.xml
          retention-days: 1
